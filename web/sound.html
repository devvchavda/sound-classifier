<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound tagger: one sound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Sound tagger</span>
      </a>
      <nav class="sound-nav">
        <a id="prev" href="#">← <span></span></a>
        <a href="/#sounds">All sounds</a>
        <a id="next" href="#"><span></span> →</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow" id="group"></p>
        <h1 id="name">…</h1>
        <p class="error" id="error" role="alert"></p>
      </section>

      <section class="glass facts-card" id="facts-card" hidden>
        <div class="card-head"><h2>About this sound</h2></div>
        <dl class="facts" id="facts"></dl>
      </section>

      <section class="glass examples-card" id="examples-card" hidden>
        <div class="card-head">
          <h2>What it looks like to the model</h2>
          <p class="hint" id="examples-hint"></p>
        </div>
        <div class="examples" id="examples"></div>
      </section>
    </main>
  </div>
  <script src="common.js"></script>
  <script src="sound.js"></script>
</body>
</html>
